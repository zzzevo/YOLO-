<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>实时识别（画面上直接画框）</title>
<style>
  html,body{margin:0;height:100%;background:#111;color:#eee;font-family:system-ui,-apple-system,"Microsoft YaHei",sans-serif;}
  #wrap{position:relative;width:100vw;height:100vh;overflow:hidden;}
  #view{display:block;width:100%;height:100%;object-fit:contain;background:#000;}
  #bar{position:absolute;left:0;right:0;top:0;padding:6px 10px;font-size:13px;line-height:1.5;
       background:linear-gradient(#000c,#0000);pointer-events:none;}
  #bar b{color:#6f6}
  #start{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
         gap:14px;background:#000d;text-align:center;padding:20px;}
  #start h2{margin:0;font-size:20px}
  button{font-size:18px;padding:12px 22px;border-radius:10px;border:0;background:#2b7fff;color:#fff;font-weight:600}
  #tips{font-size:12px;color:#aaa;max-width:520px}
  #qr{background:#fff;padding:8px;border-radius:8px}
  video{display:none}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="view"></canvas>
  <div id="bar">
    <div>模型 <b id="model">-</b>　推理 <b id="ms">-</b> ms　上传 <b id="upfps">-</b> fps　延迟 <b id="rtt">-</b> ms</div>
    <div id="det">等待开始…</div>
  </div>
  <div id="start">
    <h2>实时识别 · 手机摄像头</h2>
    <div>框会直接画在实时画面上，并跟着球走</div>
    <button id="go">开启摄像头</button>
    <div id="qrbox">
      <div>电脑上打开本页面时，可用手机扫这个码：</div>
      <img id="qr" width="150" height="150" src="/qr.png" alt="QR">
    </div>
    <div id="tips">需要 HTTPS（手机浏览器规则）；画面不上传保存，只在内存里做推理。</div>
  </div>
  <video id="cam" playsinline muted></video>
</div>
<script>
const video = document.getElementById('cam');
const view  = document.getElementById('view');
const ctx   = view.getContext('2d');
const work  = document.createElement('canvas');
const wctx  = work.getContext('2d');

const UPLOAD_W   = 640;      // 上传给服务器的宽度（越小越快）
const JPEG_Q     = 0.6;      // 上传画质
let   UPLOAD_FPS = 12;       // 每秒上传多少帧（服务器推理是瓶颈）
const SMOOTH     = 0.45;     // 框跟随时平滑系数（越大越跟手、越小越顺滑）
const COAST_MS   = 600;      // 目标短暂丢失后框保留多久（看起来“一直跟着”）

let running=false, tracks=[], lastMsg=0, rtt=0, sendT=0, inFlight=false;
let inferW=640, inferH=480, serverMs=0, upCnt=0, upFps=0;

function iou(a,b){
  const ix=Math.max(0,Math.min(a[2],b[2])-Math.max(a[0],b[0]));
  const iy=Math.max(0,Math.min(a[3],b[3])-Math.max(a[1],b[1]));
  const inter=ix*iy;
  const ua=(a[2]-a[0])*(a[3]-a[1])+(b[2]-b[0])*(b[3]-b[1])-inter;
  return ua>0?inter/ua:0;
}
const COLORS=['#22d36b','#ff8a3d','#3da5ff','#ffd93d'];

function resize(){
  const r = video.videoWidth/video.videoHeight || 4/3;
  const w = window.innerWidth, h = window.innerHeight;
  view.width  = Math.round(r >= w/h ? w : h*r);
  view.height = Math.round(r >= w/h ? w/r : h);
}
window.addEventListener('resize', resize);

async function sendFrame(blob){
  sendT = performance.now();
  try{
    const r = await fetch('/detect', {method:'POST', body:blob});
    const d = await r.json();
    serverMs = d.ms; inferW = d.w || inferW; inferH = d.h || inferH;
    rtt = performance.now() - sendT;
    updateTargets(d.boxes || []);
    document.getElementById('model').textContent = d.model || '-';
    // 自适应帧率：往返快就多发几帧（更跟手），慢就自动降（不卡）
    if(rtt < 90)      UPLOAD_FPS = Math.min(25, UPLOAD_FPS + 1);
    else if(rtt > 220) UPLOAD_FPS = Math.max(4, UPLOAD_FPS - 1);
  }catch(e){
    rtt = performance.now() - sendT;
  }
  inFlight = false;
}

// 把新检测结果与已有轨迹按 IoU 匹配 -> 只更新目标位置，绘制时平滑逼近
function updateTargets(boxes){
  const sx = view.width/inferW, sy = view.height/inferH;
  const now = performance.now();
  const inc = boxes.map(b=>({
    box:[b.x1*sx,b.y1*sy,b.x2*sx,b.y2*sy], cls:b.cls, cid:(b.cid|0), conf:b.conf
  }));
  const used = new Array(inc.length).fill(false);
  for(const t of tracks){
    let best=0, bi=-1;
    for(let i=0;i<inc.length;i++){
      if(used[i]) continue;
      const v = iou(t.box, inc[i].box);
      if(v>best){best=v;bi=i;}
    }
    if(bi>=0 && best>0.2){
      used[bi]=true;
      t.target=[...inc[bi].box]; t.cls=inc[bi].cls; t.cid=inc[bi].cid;
      t.conf=inc[bi].conf; t.seen=now;
    }
  }
  for(let i=0;i<inc.length;i++){
    if(used[i]) continue;
    tracks.push({box:[...inc[i].box], target:[...inc[i].box],
                 cls:inc[i].cls, cid:inc[i].cid, conf:inc[i].conf, seen:now, born:now});
  }
}

function draw(){
  requestAnimationFrame(draw);
  if(!video.videoWidth) return;
  ctx.drawImage(video, 0, 0, view.width, view.height);
  const now = performance.now();
  tracks = tracks.filter(t=> now - t.seen < COAST_MS);
  for(const t of tracks){
    for(let k=0;k<4;k++) t.box[k] += (t.target[k]-t.box[k]) * SMOOTH;   // 平滑跟随
    const fading = Math.max(0, 1-(now-t.seen)/COAST_MS);
    const [x1,y1,x2,y2] = t.box;
    const c = COLORS[(t.cid|0) % COLORS.length];
    ctx.globalAlpha = 0.35 + 0.65*fading;
    ctx.lineWidth = Math.max(3, view.width/220);
    ctx.strokeStyle = c;
    ctx.strokeRect(x1,y1,x2-x1,y2-y1);
    const label = `${t.cls} ${(t.conf*100).toFixed(0)}%`;
    ctx.font = `${Math.max(15, view.width/40)}px system-ui`;
    const tw = ctx.measureText(label).width + 12;
    ctx.fillStyle = c;
    ctx.fillRect(x1, Math.max(0,y1-24), tw, 24);
    ctx.fillStyle = '#000';
    ctx.fillText(label, x1+6, Math.max(17,y1-6));
    ctx.globalAlpha = 1;
  }
  document.getElementById('ms').textContent = serverMs.toFixed(0);
  document.getElementById('upfps').textContent = upFps.toFixed(0);
  document.getElementById('rtt').textContent = rtt.toFixed(0);
  const cnt = {};
  for(const t of tracks){ if(now-t.seen<300) cnt[t.cls]=(cnt[t.cls]||0)+1; }
  const txt = Object.entries(cnt).map(([k,v])=>`${k}×${v}`).join('　');
  document.getElementById('det').textContent = txt ? ('识别到：'+txt) : '识别到：无';
}

function sendLoop(){
  if(!running) return;
  if(!inFlight && video.videoWidth){
    const h = Math.round(UPLOAD_W * video.videoHeight / video.videoWidth);
    if(work.width!==UPLOAD_W || work.height!==h){ work.width=UPLOAD_W; work.height=h; }
    wctx.drawImage(video, 0, 0, UPLOAD_W, h);
    work.toBlob(b=>{
      if(b && !inFlight){
        inFlight = true; upCnt++;
        sendFrame(b);
      }
    }, 'image/jpeg', JPEG_Q);
  }
  setTimeout(sendLoop, 1000/Math.max(1,UPLOAD_FPS));
}

async function start(){
  try{
    const stream = await navigator.mediaDevices.getUserMedia({
      video:{ facingMode:{ideal:'environment'}, width:{ideal:1280}, height:{ideal:720} }, audio:false});
    video.srcObject = stream;
    await video.play();
    resize();
    document.getElementById('start').style.display='none';
    running = true;
    sendLoop(); draw();
    setInterval(()=>{ upFps = upCnt; upCnt = 0; }, 1000);
  }catch(e){
    document.getElementById('tips').textContent = '开摄像头失败：'+e.name+' — '+
      (location.protocol!=='https:' ? '必须用 https:// 打开（手机浏览器要求）' : '请允许摄像头权限');
  }
}
document.getElementById('go').onclick = start;
// 电脑上打开时，直接显示二维码即可（不自动开摄像头）
if(location.protocol!=='https:'){
  document.getElementById('tips').innerHTML =
    '提示：手机请用 <b>https://</b> 打开本页（扫码最省事）。电脑上直接用 http 打开可以看到二维码。';
}
</script>
</body>
</html>
